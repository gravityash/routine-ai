<!DOCTYPE html>
<html>
<head>
<title>Hair & Skin Analysis - WellnessIQ</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
<script src="{{ url_for('static', filename='theme.js') }}"></script>
<script src="{{ url_for('static', filename='i18n.js') }}"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

body {
    margin: 0;
    font-family: 'Outfit', sans-serif;
    background: linear-gradient(135deg, #f8fafc 0%, #e0f2fe 50%, #d1fae5 100%);
    background-size: 200% 200%;
    animation: gradientBG 15s ease infinite;
    color: #0f172a;
    min-height: 100vh;
}

@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.container {
    max-width: 800px;
    margin: auto;
    padding: 40px 20px;
}

.header {
    text-align: center;
    margin-bottom: 40px;
}

.header h1 {
    font-size: 2.5rem;
    font-weight: 800;
    margin-bottom: 10px;
    background: linear-gradient(to right, #10b981, #3b82f6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.header p {
    color: #475569;
    font-size: 1.1rem;
}

.card {
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 30px;
    border-radius: 20px;
    margin-top: 25px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
    border: 1px solid rgba(255, 255, 255, 1);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.btn {
    display: inline-block;
    padding: 12px 24px;
    background: linear-gradient(135deg, #10b981, #3b82f6);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    color: white;
    font-weight: 600;
    font-size: 16px;
    text-decoration: none;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(59, 130, 246, 0.2);
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(59, 130, 246, 0.3);
}

.btn-secondary {
    background: white;
    color: #3b82f6;
    border: 2px solid #3b82f6;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}

/* Loading animation */
.loader {
    display: inline-block;
    width: 40px;
    height: 40px;
    border: 4px solid rgba(0,0,0,.1);
    border-radius: 50%;
    border-top-color: #3b82f6;
    animation: spin 1s ease-in-out infinite;
    margin-bottom: 20px;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

#output {
    animation: fadeIn 0.5s ease-in-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Markdown Styles */
.markdown-body {
    color: #334155;
    line-height: 1.6;
    font-size: 15px;
}
.markdown-body h1, .markdown-body h2 {
    color: #0f172a;
    margin-top: 1.5em;
    border-bottom: 1px solid rgba(0,0,0,0.1);
    padding-bottom: 8px;
}
.markdown-body h3 {
    color: #3b82f6;
    margin-top: 1.2em;
}
.markdown-body ul, .markdown-body ol {
    padding-left: 20px;
    margin-bottom: 1em;
}
.markdown-body li {
    margin-bottom: 8px;
}
.markdown-body strong {
    color: #0f172a;
}
.markdown-body p {
    margin-bottom: 1em;
}
</style>
</head>

<body>

<div class="container">

<div class="header" style="position:relative;">
<div style="position:absolute; top:0; right:0; display:flex; align-items:center; gap:10px;">
    <button class="theme-toggle-btn" onclick="toggleTheme()" style="position:static;">🌓</button>
    <a href="/dashboard" class="btn btn-secondary" style="padding:8px 16px;">Back to Dashboard</a>
</div>
<h1>Hair & Skin Analysis 💆</h1>
<p>Deep-dive clinical insights based on your health metrics</p>
</div>

<!-- OUTPUT -->
<div id="output" style="text-align: center;">
    <div class="card">
        <div class="loader"></div>
        <h3 class="text-gray">Analyzing Your Dermatology Profile...</h3>
        <p class="text-gray" style="font-size: 0.9em;">Running ML models and querying AI...</p>
    </div>
</div>

</div>

<script>
async function runAnalysis(){
    const output = document.getElementById('output');
    
    // Read from localStorage
    const savedData = localStorage.getItem('userData');
    
    if (!savedData) {
        output.innerHTML = `
        <div class="card" style="text-align:center;">
            <h3>⚠️ No Data Found</h3>
            <p>We couldn't find your health metrics. Please complete your daily data entry on the main dashboard first.</p>
            <a href="/dashboard" class="btn">Go to Dashboard</a>
        </div>`;
        return;
    }

    const data = JSON.parse(savedData);

    try {
        const res = await fetch("/predict-hair-skin",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify(data)
        });

        const result = await res.json();

        let rawHtml = marked.parse(result.ai_markdown);
        let sections = rawHtml.split(/(?=<h2)/i);
        let finalHtml = "";
        
        // Add a section for the ML baseline
        finalHtml += `
        <div class="card" style="border-left: 4px solid #3b82f6;">
            <h3 style="margin-bottom: 10px;">🩺 Clinical Baseline</h3>
            <p style="margin: 0;"><strong>ML Routine Suggestion:</strong> ${result.prediction.hair_skin_care}</p>
        </div>`;
        
        sections.forEach(sec => {
            if(sec.trim() !== '') {
                finalHtml += `<div class="card markdown-body" style="text-align: left;">${sec}</div>`;
            }
        });
        
        output.innerHTML = finalHtml;

    } catch(err) {
        output.innerHTML = `
        <div class="card">
            <h3 style="color: #ef4444;">❌ Error Connecting to API</h3>
            <p>Could not generate your analysis at this time. Please try again later.</p>
            <a href="/dashboard" class="btn btn-secondary">Back to Dashboard</a>
        </div>`;
    }
}

// Run automatically on page load
window.onload = runAnalysis;

</script>

</body>
</html>
