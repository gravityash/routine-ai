<div class="header-row" style="margin-bottom: 32px; display: flex; justify-content: space-between; align-items: flex-end;">
    <div>
        <h1 class="page-title" style="font-size: 2.2rem; font-weight: 800; color: #f8fafc; margin: 0 0 8px 0;">Goal Tracking</h1>
        <p class="page-subtitle" style="color: #94a3b8; margin: 0; font-size: 1.05rem;">Set, monitor, and achieve your personal health targets</p>
    </div>
    <button onclick="document.getElementById('addGoalModal').style.display='flex'" style="background: linear-gradient(135deg, #0ea5e9, #3b82f6); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px;">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width:20px;height:20px;"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
        Add New Goal
    </button>
</div>

<div id="goalsContainer" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px;">
    <!-- Goals loaded here via JS -->
</div>

<!-- Add Goal Modal -->
<div id="addGoalModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 100; align-items: center; justify-content: center;">
    <div style="background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 32px; width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.4);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <h3 style="margin: 0; color: #f8fafc; font-size: 1.4rem;">Create a Goal</h3>
            <button onclick="document.getElementById('addGoalModal').style.display='none'" style="background: transparent; border: none; color: #94a3b8; font-size: 1.5rem; cursor: pointer;">&times;</button>
        </div>
        
        <form id="goalForm" onsubmit="submitGoal(event)" style="display: flex; flex-direction: column; gap: 16px;">
            <div>
                <label style="color: #cbd5e1; font-weight: 600; font-size: 0.9rem; margin-bottom: 8px; display: block;">Category</label>
                <select id="goalCategory" required style="width: 100%; padding: 12px; border-radius: 12px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: #f8fafc; outline: none; font-family: 'Outfit', sans-serif;">
                    <option value="Sleep goal">Sleep</option>
                    <option value="Water goal">Water Intake</option>
                    <option value="Weight goal">Weight Management</option>
                    <option value="Exercise goal">Exercise Duration</option>
                    <option value="Meditation goal">Mindfulness</option>
                </select>
            </div>
            <div>
                <label style="color: #cbd5e1; font-weight: 600; font-size: 0.9rem; margin-bottom: 8px; display: block;">Target Value</label>
                <input type="number" step="0.1" id="goalTarget" required style="width: 100%; padding: 12px; border-radius: 12px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: #f8fafc; outline: none; font-family: 'Outfit', sans-serif; box-sizing: border-box;">
            </div>
            <div>
                <label style="color: #cbd5e1; font-weight: 600; font-size: 0.9rem; margin-bottom: 8px; display: block;">Unit</label>
                <input type="text" id="goalUnit" required placeholder="e.g., hrs, L, kg, mins" style="width: 100%; padding: 12px; border-radius: 12px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: #f8fafc; outline: none; font-family: 'Outfit', sans-serif; box-sizing: border-box;">
            </div>
            
            <button type="submit" style="background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 700; cursor: pointer; margin-top: 8px;">Save Goal</button>
        </form>
    </div>
</div>

<script>
(function() {
    async function loadGoals() {
        try {
            const res = await fetch('/api/goals');
            const data = await res.json();
            
            const container = document.getElementById('goalsContainer');
            if(!container) return;

            if(!data.goals || data.goals.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1 / -1; background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.1); border-radius: 20px; padding: 60px 20px; text-align: center;">
                        <div style="font-size: 3rem; margin-bottom: 16px;">🎯</div>
                        <h3 style="color: #f8fafc; margin: 0 0 8px 0;">No Active Goals</h3>
                        <p style="color: #94a3b8; margin: 0;">Set up your first health goal to start tracking progress.</p>
                    </div>
                `;
                return;
            }

            const icons = {
                'Sleep goal': {i: '🌙', c: '#8b5cf6'},
                'Water goal': {i: '💧', c: '#3b82f6'},
                'Weight goal': {i: '⚖️', c: '#f59e0b'},
                'Exercise goal': {i: '🏃', c: '#10b981'},
                'Meditation goal': {i: '🧘', c: '#0ea5e9'}
            };

            container.innerHTML = data.goals.map(g => {
                const conf = icons[g.category] || {i: '🎯', c: '#64748b'};
                let progressPerc = g.target > 0 ? Math.min(100, Math.round((g.progress / g.target) * 100)) : 0;
                if(g.category === 'Weight goal') {
                    progressPerc = g.progress ? 100 : 0;
                }

                return `
                <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; padding: 24px; position: relative; overflow: hidden;">
                    <button onclick="deleteGoal(${g.id})" style="position: absolute; top: 16px; right: 16px; background: transparent; border: none; color: #ef4444; font-size: 1.2rem; cursor: pointer; opacity: 0.7; transition: opacity 0.2s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.7">&times;</button>
                    
                    <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 24px;">
                        <div style="width: 48px; height: 48px; border-radius: 16px; background: ${conf.c}20; color: ${conf.c}; display: flex; align-items: center; justify-content: center; font-size: 1.5rem;">
                            ${conf.i}
                        </div>
                        <div>
                            <h3 style="margin: 0; color: #f8fafc; font-size: 1.1rem;">${g.category.replace(' goal', '')}</h3>
                            <p style="margin: 4px 0 0 0; color: #94a3b8; font-size: 0.85rem; font-weight: 600;">Target: ${g.target} ${g.unit}</p>
                        </div>
                    </div>

                    <div style="margin-bottom: 12px; display: flex; justify-content: space-between; align-items: baseline;">
                        <span style="color: #f8fafc; font-size: 1.8rem; font-weight: 800;">${g.progress} <span style="font-size: 0.9rem; color: #64748b; font-weight: 600;">${g.unit}</span></span>
                        <span style="color: ${conf.c}; font-weight: 700; font-size: 0.9rem;">${progressPerc}%</span>
                    </div>

                    <div style="width: 100%; height: 8px; background: rgba(0,0,0,0.3); border-radius: 4px; overflow: hidden;">
                        <div style="height: 100%; width: ${progressPerc}%; background: ${conf.c}; border-radius: 4px; transition: width 1s ease-out;"></div>
                    </div>
                </div>
                `;
            }).join('');

        } catch(e) { console.error(e); }
    }

    async function submitGoal(e) {
        e.preventDefault();
        const payload = {
            category: document.getElementById('goalCategory').value,
            target: parseFloat(document.getElementById('goalTarget').value),
            unit: document.getElementById('goalUnit').value
        };
        
        await fetch('/api/goals', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        
        document.getElementById('addGoalModal').style.display = 'none';
        document.getElementById('goalForm').reset();
        loadGoals();
    }

    async function deleteGoal(id) {
        if(confirm("Are you sure you want to delete this goal?")) {
            await fetch('/api/goals', {
                method: 'DELETE',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({id: id})
            });
            loadGoals();
        }
    }

    window.loadGoals = loadGoals;
    window.submitGoal = submitGoal;
    window.deleteGoal = deleteGoal;

    const catSelect = document.getElementById('goalCategory');
    if (catSelect) {
        catSelect.addEventListener('change', function() {
            const val = this.value;
            const unitInput = document.getElementById('goalUnit');
            if(!unitInput) return;
            if(val === 'Sleep goal') unitInput.value = 'hrs';
            else if(val === 'Water goal') unitInput.value = 'L';
            else if(val === 'Weight goal') unitInput.value = 'kg';
            else if(val === 'Exercise goal') unitInput.value = 'mins';
            else if(val === 'Meditation goal') unitInput.value = 'mins';
        });
    }

    loadGoals();
    const unitInput = document.getElementById('goalUnit');
    if(unitInput) unitInput.value = 'hrs';
})();
</script>
